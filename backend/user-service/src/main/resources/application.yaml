server:
  port: ${SERVER_PORT:9081}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5533/users}   # matessa-db host port (5533), 'users' database
    username: ${SPRING_DATASOURCE_USERNAME:matessa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_strong_password}
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:file:../../keys/jwt-private.pem}   # relative to the module dir for local run
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:../../keys/jwt-public.pem}
  access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}        # 15 min
  refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}   # 7 days
  issuer: ${JWT_ISSUER:matessa-user-service}          # signed into every token; validated by every service

# Stores served by this deployment. Each id is also a Postgres schema in this service's DB.
app:
  tenancy:
    tenants: ${APP_TENANCY_TENANTS:matessa,adventure}
  # Initial admin per store (seeded on boot if missing; idempotent). No default password is
  # shipped — a store whose password is unset is skipped. Disable with ADMIN_SEED_ENABLED=false.
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
  admins:
    matessa:
      email: ${MATESSA_ADMIN_EMAIL:admin@matessa.com}
      password: ${MATESSA_ADMIN_PASSWORD:}
    adventure:
      email: ${ADVENTURE_ADMIN_EMAIL:admin@adventuredose.com}
      password: ${ADVENTURE_ADMIN_PASSWORD:}

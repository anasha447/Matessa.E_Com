server:
  port: ${SERVER_PORT:9082}

spring:
  application:
    name: commercial-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # 'redis' in docker-compose; caches the catalog read paths
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false                # cache-only; don't scan JPA repos as Redis repositories
  servlet:
    multipart:
      max-file-size: 8MB       # matches the 8 MB cap enforced in WebpImageStorageService
      max-request-size: 10MB
  datasource:
    hikari:
      # Per instance. Keep (replicas x pool) of all services under Postgres max_connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5533/commercial}   # matessa-db host port (5533), 'commercial' database
    username: ${SPRING_DATASOURCE_USERNAME:matessa_commercial}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_strong_password}
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: commercial-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

# Validates the RS256 access token with the PUBLIC key only (never signs).
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:../../keys/jwt-public.pem}
  # Must match user-service's jwt.issuer — tokens from any other issuer are rejected.
  issuer: ${JWT_ISSUER:matessa-user-service}

# Uploaded product images: converted to WebP and stored here, served at /media/**.
# In Docker this is a mounted volume so images survive rebuilds; locally it defaults
# to a project-relative dir.
app:
  tenancy:
    tenants: ${APP_TENANCY_TENANTS:matessa,adventure}   # one Postgres schema per store
  media:
    # Where images live: 'local' (a directory; one instance only) or 's3' (shared bucket — MinIO
    # in docker-compose, any S3 in production; required to run more than one replica).
    store: ${APP_MEDIA_STORE:local}
    # local: root directory. New uploads go to <dir>/<store>/…; images from before the store
    # split stay at <dir>/products/… (their URLs keep working).
    dir: ${APP_MEDIA_DIR:./media}
    webp-quality: ${APP_MEDIA_WEBP_QUALITY:0.82}
    s3:
      endpoint: ${APP_MEDIA_S3_ENDPOINT:}          # e.g. http://minio:9000 ; empty = AWS
      region: ${APP_MEDIA_S3_REGION:us-east-1}
      bucket: ${APP_MEDIA_S3_BUCKET:matessa-media}
      access-key: ${APP_MEDIA_S3_ACCESS_KEY:}
      secret-key: ${APP_MEDIA_S3_SECRET_KEY:}

# Service-to-service key for /internal/** (order-service -> commercial-service).
app.internal.api-key: ${INTERNAL_API_KEY:}

# Deployment override: stop publishing everything except the public entry points.
#
# Why: the base docker-compose.yml is a local development descriptor and publishes a host
# port for each service (Swagger on 9081-9083, Eureka on 9761, Postgres on 5533, Redis on
# 6380) because that is genuinely useful on a laptop. Those same ports in a deployment put
# the database and every service on the host interface, letting a caller skip the gateway —
# and with it CORS and the edge rate limiting. JWT validation still runs in each service, so
# authorization holds either way, but the throttling does not.
#
# This override removes those publications. Only Caddy (ports 80/443) faces the internet:
# it terminates TLS for both store domains and proxies to the storefronts. The storefronts,
# the gateway and everything behind them are on the internal Docker network only, so the
# browser can reach nothing but the storefront BFFs — which set the store and forward only
# the client IP Caddy saw (see deploy/Caddyfile).
#
# It also hardens the runtime:
#   restart: always       a crashed or OOM-killed container restarts by itself, and the whole
#                         stack comes back after a host reboot.
#   mem_limit             one runaway service cannot starve the others (heaps are already capped
#                         with -Xmx in the base file; the limit leaves room for off-heap memory).
#   Swagger/OpenAPI off   no public map of every endpoint.
#   actuator health,info  metrics and gateway internals are never exposed.
#
# Usage — this is the deployment command:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#
# Note `!reset` needs Compose v2.24+.
#
# Also in production:
#   SPRING_PROFILES_ACTIVE=prod  order-service accepts only cash on delivery until a real payment
#                                provider is connected (the mock processor is not loaded).
#   MinIO                        product images in a shared bucket, so commercial-service can
#                                run as several replicas (APP_MEDIA_STORE=s3).

x-spring-prod: &spring-prod
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

services:
  matessa-db:
    ports: !reset []
    restart: always

  redis:
    ports: !reset []
    restart: always

  kafka:
    restart: always

  eureka-server:
    ports: !reset []
    restart: always

  api-gateway:
    ports: !reset []           # reached only by the storefront BFFs on the internal network
    restart: always
    mem_limit: 600m
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      TRACING_SAMPLING: "${TRACING_SAMPLING:-0}"

  user-service:
    ports: !reset []
    restart: always
    mem_limit: 700m
    environment: *spring-prod

  commercial-service:
    ports: !reset []
    restart: always
    mem_limit: 700m
    environment:
      <<: *spring-prod
      APP_MEDIA_STORE: s3
      APP_MEDIA_S3_ENDPOINT: http://minio:9000
      APP_MEDIA_S3_BUCKET: matessa-media
      APP_MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      APP_MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_healthy

  order-service:
    ports: !reset []
    restart: always
    mem_limit: 700m
    environment:
      <<: *spring-prod
      SPRING_PROFILES_ACTIVE: prod     # COD-only until a real payment provider exists

  frontend:
    ports: !reset []           # behind Caddy
    environment:
      TRUST_PROXY_IP_HEADER: "true"   # X-Real-IP is set (and overwritten) by Caddy

  second-frontend:
    ports: !reset []           # behind Caddy
    environment:
      TRUST_PROXY_IP_HEADER: "true"

  # ---- the only public entry point: TLS + reverse proxy for both store domains ----
  caddy:
    image: caddy:2.10-alpine
    container_name: matessa-caddy
    profiles: ["prod"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      MATESSA_DOMAIN: ${MATESSA_DOMAIN:?set MATESSA_DOMAIN in .env}
      ADVENTURE_DOMAIN: ${ADVENTURE_DOMAIN:?set ADVENTURE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificates — keep this volume
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      second-frontend:
        condition: service_healthy
    networks:
      - matessa-net

  # ---- product images: S3-compatible bucket shared by every commercial-service replica ----
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: matessa-minio
    command: server /data
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - matessa-minio-data:/data
    networks:
      - matessa-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  matessa-minio-data:

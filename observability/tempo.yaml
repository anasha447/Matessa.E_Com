# Minimal single-binary Tempo for local dev: receive OTLP (http 4318 / grpc 4317),
# store traces on a local volume. Queried by Grafana at :3200.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Dev: keep traces briefly; this is not a production retention policy.
compactor:
  compaction:
    block_retention: 1h
